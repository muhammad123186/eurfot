{% block content %}


<body style="background: linear-gradient(90deg,black,black);"></body>

<div style="max-width:650px;margin:40px auto;padding:20px;font-family:Arial;color:white;">

    <h2 style="text-align:center;">

</h2>

    <label style="color:white;margin-left:8px;">
        الرسم الخططي:

    <select

            border-radius:8px;

        <option value="4-5-1">4-5-1</option>

           <div class="fantasy-pitch">

    <!-- خطوط الملعب -->

    </div>

        <button
            type="button"
            id="save-team-image"

                width:100%;

                margin-top:15px;

                cursor:pointer;
            "

        </button>

        <button type="submit" style="width:100%;padding:12px;background:rgb(255, 0, 0);color:black;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:20px;">

        </button>

    </form>

            <button type="button" id="picker-close" style="width:100%;padding:10px;margin-top:15px;background:#333;color:white;border:none;border-radius:8px;cursor:pointer;">

<!-- ================= CSS ================= -->

<style>


.fantasy-pitch {
    position: relative;
    overflow: hidden;
    background: linear-gradient(
        45deg,
        rgba(30, 255, 0, 0.541)
    );
    border-radius: 15px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    gap: 15px;
    min-height: 500px;
}

.formation-row {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
}


/* =========================================
   دائرة اللاعب
   ========================================= */

.player-slot {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: rgba(0, 0, 0, 0.6);

    border: 2px solid white;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 11px;

    cursor: pointer;

    padding: 0;

    line-height: 1.2;

    overflow: visible;

    position: relative;
}

.player-slot.filled {
    background: #111;
    border-color: #ff0000;
    font-size: 10px;
}


/* =========================================
   مناطق الملعب
   ========================================= */

.penalty-box {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 220px;
    height: 110px;

    border: 2px solid rgba(255, 255, 255, 0.65);
    border-bottom: none;

    z-index: 0;
}

.goal-box {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 100px;
    height: 45px;

    border: 2px solid rgba(255, 255, 255, 0.65);
    border-bottom: none;

    z-index: 0;
}

.penalty-spot {
    position: absolute;

    left: 50%;
    bottom: 90px;

    transform: translateX(-50%);

    width: 6px;
    height: 6px;

    background: rgba(255, 255, 255, 0.65);

    border-radius: 50%;

    z-index: 0;
}

.center-circle {
    position: absolute;

    top: 0;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 150px;
    height: 150px;

    border: 2px solid rgba(255, 255, 255, 0.65);

    border-radius: 50%;

    z-index: 0;
}


/* =========================================
   قائمة اختيار اللاعبين
   ========================================= */

.player-picker-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.65);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 99999;

    padding: 20px;
}

.player-picker {
    width: 100%;
    max-width: 430px;

    max-height: 80vh;

    background: #111;

    border-radius: 14px;

    overflow: hidden;

    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);

    direction: rtl;
}

.player-picker-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 15px 18px;

    background: #1b1b1b;

    border-bottom: 1px solid #333;
}

.player-picker-title {
    color: white;

    font-size: 18px;

    font-weight: bold;
}

.player-picker-close {
    border: none;

    background: transparent;

    color: white;

    font-size: 28px;

    cursor: pointer;

    line-height: 1;
}

.player-picker-search {
    display: block;

    width: calc(100% - 30px);

    margin: 15px;

    padding: 11px 14px;

    box-sizing: border-box;

    border: 1px solid #444;

    border-radius: 9px;

    background: #202020;

    color: white;

    outline: none;

    font-size: 14px;
}

.player-picker-search::placeholder {
    color: #aaa;
}

.player-picker-list {
    max-height: 55vh;

    overflow-y: auto;

    padding: 0 10px 10px;
}

.player-picker-item {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px;

    margin-bottom: 6px;

    border: none;

    border-radius: 9px;

    background: #1c1c1c;

    color: white;

    cursor: pointer;

    text-align: right;

    transition: 0.2s;
}

.player-picker-item:hover {
    background: #292929;
}

.player-picker-photo {
    width: 48px;
    height: 48px;

    object-fit: contain;

    border-radius: 50%;

    flex-shrink: 0;
}

.player-picker-info {
    display: flex;

    flex-direction: column;

    gap: 4px;

    min-width: 0;
}

.player-picker-info strong {
    color: white;

    font-size: 14px;
}

.player-picker-info span {
    color: #aaa;

    font-size: 12px;
}

.player-picker-empty {
    text-align: center;

    color: #aaa;

    padding: 30px 10px;
}


/* =========================================
   اللاعب المختار داخل الملعب
   ========================================= */

.player-slot-info {
    position: absolute;

    top: 0;
    left: 0;

    width: 65px;
    height: 65px;

    margin: 0;
    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;
}


/* صورة اللاعب */

.selected-player-image {
    position: absolute;

    top: 0;
    left: 0;

    width: 65px;
    height: 65px;

    margin: 0;
    padding: 0;

    object-fit: cover;

    object-position: center;

    border-radius: 50%;

    display: block;

    z-index: 2;
}


/* اسم اللاعب */

.player-name {
    position: absolute;

    top: 69px;
    left: 50%;

    transform: translateX(-50%);

    width: 110px;

    margin: 0;
    padding: 0;

    color: white;

    font-size: 11px;

    font-weight: bold;

    line-height: 1.2;

    text-align: center;

    white-space: nowrap;

    z-index: 10;
}




@media (max-width: 1000px) {

    html,
    body {
        overflow-x: hidden;
        width: 100%;
    }

    .fantasy-pitch {
        width: calc(100% - 20px);
        margin: 15px auto;
        padding: 15px 5px;
        min-height: 520px;
        box-sizing: border-box;
    }

    .player-slot {
        width: 58px;
        height: 58px;
        min-width: 58px;
        min-height: 58px;
        padding: 0;
        box-sizing: border-box;
    }

    .player-slot-info {
        width: 58px;
        height: 58px;
    }

    .selected-player-image {
        width: 58px;
        height: 58px;
    }

    .player-name {
        top: 62px;
        width: 90px;
        font-size: 10px;
    }

    .penalty-box {
        width: 180px;
        height: 90px;
    }

    .goal-box {
        width: 85px;
        height: 38px;
    }

    .penalty-spot {
        bottom: 72px;
    }

    .center-circle {
        width: 125px;
        height: 125px;
    }

}


</style>

<!-- ================= JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    /* =========================================================
       بيانات اللاعبين
       نبحث عن JSON الخاص باللاعبين بدون الاعتماد على ID محدد
       ========================================================= */

    let allPlayers = [];

    const jsonScripts = document.querySelectorAll(
        'script[type="application/json"]'
    );

    for (const script of jsonScripts) {
        try {
            const data = JSON.parse(script.textContent);

            if (
                Array.isArray(data) &&
                data.length > 0 &&
                typeof data[0] === "object" &&
                data[0] !== null &&
                (
                    "id" in data[0] ||
                    "name" in data[0]
                )
            ) {
                allPlayers = data;
                break;
            }
        } catch (error) {
            /* ليس JSON الخاص باللاعبين */
        }
    }


    /*
     * احتياط إضافي إذا كان eligible_players
     * موجودًا على window.
     */

    if (
        !allPlayers.length &&
        Array.isArray(window.eligible_players)
    ) {
        allPlayers = window.eligible_players;
    }


    console.log(
        "Eligible players:",
        allPlayers.length
    );


    /* =========================================================
       اللاعبين المختارين حاليًا
       ========================================================= */

    const selectedIds = new Set();


/*
 * قراءة اللاعبين المحفوظين من Django
 */
const existingIdsElement =
    document.getElementById("existing-ids-data");

if (existingIdsElement) {

    try {

        const existingIds =
            JSON.parse(
                existingIdsElement.textContent
            );

        if (Array.isArray(existingIds)) {

            existingIds.forEach(
                function (id) {

                    const playerId =
                        Number(id);

                    if (playerId) {
                        selectedIds.add(
                            playerId
                        );
                    }
                }
            );
        }

    } catch (error) {

        console.error(
            "Error reading existing player IDs:",
            error
        );
    }
}


/*
 * إذا كانت هناك hidden inputs موجودة أصلًا،
 * نقرأ اللاعبين منها أيضًا.
 */

document.querySelectorAll(
    'input[name="players"]'
).forEach(function (input) {

    const id =
        Number(input.value);

    if (id) {
        selectedIds.add(id);
    }
});


console.log(
    "Saved players:",
    Array.from(selectedIds)
);

console.log(
    "Saved players count:",
    selectedIds.size
);


    /* =========================================================
       الرسمات الخططية
       ========================================================= */

    const formations = {

        "4-3-3": {
            goalkeeper: [1],
            defense: [4],
            midfield: [3],
            attack: [3]
        },

        "4-4-2": {
            goalkeeper: [1],
            defense: [4],
            midfield: [4],
            attack: [2]
        },

        "4-2-3-1": {
            goalkeeper: [1],
            defense: [4],

            /* 3 لاعبين هجوميًا فوق 2 محاور */
            midfield: [3, 2],

            attack: [1]
        },

        "4-3-2-1": {
            goalkeeper: [1],
            defense: [4],
            midfield: [2, 3],
            attack: [1]
        },

        "4-3-1-2": {
            goalkeeper: [1],
            defense: [4],
            midfield: [1, 3],
            attack: [2]
        },

        "4-2-1-3": {
            goalkeeper: [1],
            defense: [4],
            midfield: [1, 2],
            attack: [3]
        },

        "4-1-2-3": {
            goalkeeper: [1],
            defense: [4],
            midfield: [2, 1],
            attack: [3]
        },

        "4-2-2-2": {
            goalkeeper: [1],
            defense: [4],
            midfield: [2, 2],
            attack: [2]
        },

        "4-1-4-1": {
            goalkeeper: [1],
            defense: [4],
            midfield: [4, 1],
            attack: [1]
        },

        "4-4-1-1": {
            goalkeeper: [1],
            defense: [4],
            midfield: [1, 4],
            attack: [1]
        },

        "4-5-1": {
            goalkeeper: [1],
            defense: [4],
            midfield: [5],
            attack: [1]
        },

        "3-4-3": {
            goalkeeper: [1],
            defense: [3],
            midfield: [4],
            attack: [3]
        },

        "3-5-2": {
            goalkeeper: [1],
            defense: [3],
            midfield: [5],
            attack: [2]
        },

        "3-4-1-2": {
            goalkeeper: [1],
            defense: [3],
            midfield: [1, 4],
            attack: [2]
        },

        "3-4-2-1": {
            goalkeeper: [1],
            defense: [3],
            midfield: [2, 4],
            attack: [1]
        },

        "3-3-3-1": {
            goalkeeper: [1],
            defense: [3],
            midfield: [3, 3],
            attack: [1]
        },

        "5-3-2": {
            goalkeeper: [1],
            defense: [5],
            midfield: [3],
            attack: [2]
        },

        "5-4-1": {
            goalkeeper: [1],
            defense: [5],
            midfield: [4],
            attack: [1]
        },

        "5-2-3": {
            goalkeeper: [1],
            defense: [5],
            midfield: [2],
            attack: [3]
        },

        "5-2-2-1": {
            goalkeeper: [1],
            defense: [5],
            midfield: [2, 2],
            attack: [1]
        },

        "5-3-1-1": {
            goalkeeper: [1],
            defense: [5],
            midfield: [1, 3],
            attack: [1]
        }
    };


    /* =========================================================
       المراكز
       ========================================================= */

    const positionAliases = {

        attack: [
            "هجوم",
            "مهاجم",
            "مهاجمون",
            "مهاجمين",
            "Forward",
            "forward",
            "FW"
        ],

        midfield: [
            "وسط",
            "وسط الملعب",
            "لاعب وسط",
            "Midfielder",
            "midfielder",
            "MF"
        ],

        defense: [
            "دفاع",
            "مدافع",
            "مدافعون",
            "مدافعين",
            "Defender",
            "defender",
            "DF"
        ],

        goalkeeper: [
            "حراسة",
            "حارس",
            "حارس مرمى",
            "حراس",
            "Goalkeeper",
            "goalkeeper",
            "GK"
        ]
    };


    /* =========================================================
       تحديد مركز اللاعب
       ========================================================= */

    function getPlayerGroup(player) {

        const position =
            player.position_group ||
            player.position ||
            player.pos ||
            "";

        for (
            const group in positionAliases
        ) {

            if (
                positionAliases[group].includes(
                    position
                )
            ) {
                return group;
            }
        }

        return null;
    }


    function getArabicGroup(group) {

        if (group === "attack") {
            return "هجوم";
        }

        if (group === "midfield") {
            return "وسط";
        }

        if (group === "defense") {
            return "دفاع";
        }

        if (group === "goalkeeper") {
            return "حراسة";
        }

        return "";
    }


    /* =========================================================
       إنشاء خانة لاعب
       ========================================================= */

    function createPlayerSlot(
        group,
        lineIndex,
        slotIndex
    ) {

        const slot =
            document.createElement("div");

        slot.className =
            "player-slot";

        slot.dataset.group =
            group;

        slot.dataset.line =
            lineIndex;

        slot.dataset.slot =
            slotIndex;


        const empty =
            document.createElement("div");

        empty.className =
            "player-slot-empty";

        empty.innerHTML = "+";


        slot.appendChild(empty);


        slot.addEventListener(
            "click",
            function () {

                openPlayerPicker(
                    slot,
                    group
                );
            }
        );


        return slot;
    }


    /* =========================================================
       إنشاء سطر واحد
       ========================================================= */

    function createFormationLine(
    group,
    lineIndex,
    count
) {

    const line =
        document.createElement("div");

    line.className =
        "formation-line";

    line.style.display =
        "flex";

    line.style.flexDirection =
        "row";

    line.style.width =
        "100%";

    line.style.justifyContent =
        "center";

    line.style.alignItems =
        "center";

    line.style.boxSizing =
        "border-box";


    /*
     * المسافات تتغير حسب الجهاز
     */

    const isMobile =
        window.innerWidth <= 768;


    if (isMobile) {

        if (count === 4) {

            line.style.gap =
                "clamp(8px, 5vw, 25px)";

        } else if (count === 3) {

            line.style.gap =
                "clamp(12px, 7vw, 35px)";

        } else if (count === 2) {

            line.style.gap =
                "clamp(15px, 10vw, 45px)";

        } else {

            line.style.gap =
                "10px";
        }

    } else {

        /*
         * الكمبيوتر يبقى كما هو
         */

        if (count === 3) {

            line.style.gap =
                "12%";

        } else if (count === 4) {

            line.style.gap =
                "9%";

        } else if (count === 2) {

            line.style.gap =
                "100px";

        } else {

            line.style.gap =
                "10%";
        }
    }


    line.style.margin =
        "8px 0";


    for (
        let i = 0;
        i < count;
        i++
    ) {

        line.appendChild(
            createPlayerSlot(
                group,
                lineIndex,
                i
            )
        );
    }


    return line;
}

    /* =========================================================
       بناء مجموعة
       ========================================================= */

    function buildGroup(
        row,
        group,
        lines
    ) {

        if (!row) {
            return;
        }


        row.innerHTML = "";


        /*
         * مهم جدًا:
         *
         * لا نستخدم flex هنا.
         *
         * الـrow مجرد حاوية للخطوط.
         * كل formation-line يأخذ سطرًا خاصًا به.
         */

        row.style.display =
            "block";

        row.style.width =
            "100%";


        lines.forEach(
            function (count, index) {

                const line =
                    createFormationLine(
                        group,
                        index,
                        count
                    );

                row.appendChild(line);
            }
        );
    }


    /* =========================================================
       بناء التشكيلة
       ========================================================= */

    function buildFormation() {

        const select =
            document.getElementById(
                "formation-select"
            );


        if (!select) {
            console.error(
                "formation-select not found"
            );
            return;
        }


        const formation =
            select.value;


        const config =
            formations[formation];


        if (!config) {
            console.error(
                "Unknown formation:",
                formation
            );
            return;
        }


        const attackRow =
            document.querySelector(
                '.formation-row[data-group="هجوم"]'
            );


        const midfieldRow =
            document.querySelector(
                '.formation-row[data-group="وسط"]'
            );


        const defenseRow =
            document.querySelector(
                '.formation-row[data-group="دفاع"]'
            );


        const goalkeeperRow =
            document.querySelector(
                '.formation-row[data-group="حراسة"]'
            );


        /*
         * الهجوم
         */

        buildGroup(
            attackRow,
            "attack",
            config.attack
        );


        /*
         * الوسط
         *
         * في 4-2-3-1:
         *
         * [3]
         * [2]
         *
         * وليس:
         *
         * [3][2]
         */

        buildGroup(
            midfieldRow,
            "midfield",
            config.midfield
        );


        /*
         * الدفاع
         */

        buildGroup(
            defenseRow,
            "defense",
            config.defense
        );


        /*
         * الحراسة
         */

        buildGroup(
            goalkeeperRow,
            "goalkeeper",
            config.goalkeeper
        );


        /*
         * إعادة اللاعبين الموجودين
         */

        restorePlayers();
    }


    /* =========================================================
       اختيار لاعب
       ========================================================= */

    /* =========================================================
   قائمة اختيار اللاعبين
   ========================================================= */

function openPlayerPicker(slot, group) {

    /* إزالة أي قائمة مفتوحة */
    const oldPicker =
        document.querySelector(".player-picker");

    if (oldPicker) {
        oldPicker.remove();
    }


    /* الخلفية */
    const overlay =
        document.createElement("div");

    overlay.className =
        "player-picker-overlay";


    /* القائمة */
    const picker =
        document.createElement("div");

    picker.className =
        "player-picker";


    /* العنوان */
    const title =
        document.createElement("div");

    title.className =
        "player-picker-title";

    title.textContent =
        "اختر اللاعب";


    /* زر الإغلاق */
    const closeButton =
        document.createElement("button");

    closeButton.className =
        "player-picker-close";

    closeButton.type =
        "button";

    closeButton.innerHTML =
        "×";


    closeButton.addEventListener(
        "click",
        function () {

            overlay.remove();
        }
    );


    /* رأس القائمة */
    const header =
        document.createElement("div");

    header.className =
        "player-picker-header";

    header.appendChild(title);
    header.appendChild(closeButton);


    picker.appendChild(header);


    /* البحث */
    const search =
        document.createElement("input");

    search.type =
        "text";

    search.className =
        "player-picker-search";

    search.placeholder =
        "ابحث عن لاعب...";

    search.autocomplete =
        "off";


    picker.appendChild(search);


    /* حاوية اللاعبين */
    const playersContainer =
        document.createElement("div");

    playersContainer.className =
        "player-picker-list";


    picker.appendChild(
        playersContainer
    );


    /*
     * اللاعبين المتاحين لهذا المركز
     */

    function getAvailablePlayers() {

        return allPlayers.filter(
            function (player) {

                if (
                    getPlayerGroup(player) !==
                    group
                ) {
                    return false;
                }


                const playerId =
                    Number(player.id);


                const currentId =
                    Number(
                        slot.dataset.playerId
                    );


                /*
                 * منع تكرار اللاعب،
                 * مع السماح للاعب الموجود
                 * حاليًا في نفس الخانة.
                 */

                if (
                    selectedIds.has(playerId) &&
                    playerId !== currentId
                ) {
                    return false;
                }


                return true;
            }
        );
    }


    /* رسم اللاعبين */
    function renderPlayers(filter = "") {

        playersContainer.innerHTML =
            "";


        const normalizedFilter =
            filter
                .trim()
                .toLowerCase();


        const players =
            getAvailablePlayers()
                .filter(
                    function (player) {

                        if (!normalizedFilter) {
                            return true;
                        }


                        const name =
                            (
                                player.name || ""
                            )
                            .toLowerCase();


                        const team =
                            (
                                player.team_name || ""
                            )
                            .toLowerCase();


                        return (
                            name.includes(
                                normalizedFilter
                            ) ||
                            team.includes(
                                normalizedFilter
                            )
                        );
                    }
                );


        if (!players.length) {

            const empty =
                document.createElement("div");

            empty.className =
                "player-picker-empty";

            empty.textContent =
                "لا يوجد لاعب متاح";

            playersContainer.appendChild(
                empty
            );

            return;
        }


        players.forEach(
            function (player) {

                const item =
                    document.createElement("button");

                item.type =
                    "button";

                item.className =
                    "player-picker-item";


                item.innerHTML = `

                    <img
                        src="${player.photo || ""}"
                        alt=""
                        class="player-picker-photo"
                    >

                    <div class="player-picker-info">

                        <strong>
                            ${player.name || ""}
                        </strong>

                        <span>
                            ${player.team_name || ""}
                        </span>

                    </div>

                `;


                item.addEventListener(
                    "click",
                    function () {

                        selectPlayer(
                            slot,
                            player
                        );


                        overlay.remove();
                    }
                );


                playersContainer.appendChild(
                    item
                );
            }
        );
    }


    /* البحث */
    search.addEventListener(
        "input",
        function () {

            renderPlayers(
                this.value
            );
        }
    );


    /* إغلاق عند الضغط خارج القائمة */
    overlay.addEventListener(
        "click",
        function (event) {

            if (
                event.target === overlay
            ) {
                overlay.remove();
            }
        }
    );


    overlay.appendChild(
        picker
    );


    document.body.appendChild(
        overlay
    );


    renderPlayers();


    setTimeout(
        function () {
            search.focus();
        },
        50
    );
}


    /* =========================================================
       وضع اللاعب في الخانة
       ========================================================= */

    function selectPlayer(
        slot,
        player
    ) {

        /*
         * اللاعب القديم
         */

        const oldId =
            Number(
                slot.dataset.playerId
            );


        if (oldId) {
            selectedIds.delete(
                oldId
            );
        }


        /*
         * اللاعب الجديد
         */

        const playerId =
            Number(player.id);


        slot.dataset.playerId =
            playerId;


        selectedIds.add(
            playerId
        );


        const empty =
            slot.querySelector(
                ".player-slot-empty"
            );


        if (empty) {
            empty.style.display =
                "none";
        }


        let info =
            slot.querySelector(
                ".player-slot-info"
            );


        if (!info) {

            info =
                document.createElement(
                    "div"
                );

            info.className =
                "player-slot-info";

            slot.appendChild(
                info
            );
        }


        info.style.display =
            "flex";


        info.style.flexDirection =
            "column";

        info.style.alignItems =
            "center";


        
        info.innerHTML = `

    <img
        src="${player.photo || ""}"
        alt="${player.name || ""}"
        class="selected-player-image"
    >

    <span class="player-name">
        ${player.name || ""}
    </span>

`;
    }


    /* =========================================================
       إعادة اللاعبين المحفوظين
       ========================================================= */

    function restorePlayers() {

        if (!selectedIds.size) {
            return;
        }


        selectedIds.forEach(
            function (playerId) {

                const player =
                    allPlayers.find(
                        function (p) {

                            return Number(p.id) ===
                                Number(playerId);
                        }
                    );


                if (!player) {
                    return;
                }


                const group =
                    getPlayerGroup(player);


                if (!group) {
                    return;
                }


                const arabicGroup =
                    getArabicGroup(group);


                const row =
                    document.querySelector(
                        `.formation-row[data-group="${arabicGroup}"]`
                    );


                if (!row) {
                    return;
                }


                const emptySlots =
                    row.querySelectorAll(
                        ".player-slot:not([data-player-id])"
                    );


                if (!emptySlots.length) {
                    return;
                }


                selectPlayer(
                    emptySlots[0],
                    player
                );
            }
        );
    }


    /* =========================================================
       تغيير الخطة
       ========================================================= */

    const formationSelect =
        document.getElementById(
            "formation-select"
        );


    if (formationSelect) {

        formationSelect.addEventListener(
            "change",
            function () {

                buildFormation();
            }
        );
    }


    /* =========================================================
       إرسال التشكيلة
       ========================================================= */

    const form =
        formationSelect
            ? formationSelect.closest("form")
            : document.querySelector("form");

    document.addEventListener(
    "submit",
    function (event) {

        const form = event.target;

        if (!(form instanceof HTMLFormElement)) {
            return;
        }

        const ids = Array.from(selectedIds)
            .map(Number)
            .filter(function (id) {
                return id > 0;
            });

        console.log(
            "Players before submit:",
            ids
        );

        console.log(
            "Players count:",
            ids.length
        );

        if (ids.length !== 11) {

            event.preventDefault();

            alert(
                "يجب اختيار 11 لاعبًا بالضبط لتشكيلة الأسبوع"
            );

            return;
        }

        /*
         * حذف أي inputs قديمة
         */
        form.querySelectorAll(
            'input[name="players"]'
        ).forEach(
            function (input) {
                input.remove();
            }
        );

        /*
         * إضافة اللاعبين إلى نفس الفورم
         * الذي ضغط المستخدم زر الحفظ داخله
         */
        ids.forEach(
            function (id) {

                const input =
                    document.createElement(
                        "input"
                    );

                input.type = "hidden";
                input.name = "players";
                input.value = id;

                form.appendChild(input);
            }
        );

        console.log(
            "11 player inputs added to submitted form"
        );
    }
);

        /* =========================================================
       حفظ التشكيلة كصورة
       ========================================================= */

    const saveTeamImage =
        document.getElementById("save-team-image");

    if (saveTeamImage) {

        saveTeamImage.addEventListener(
            "click",
            async function () {

                const pitch =
                    document.querySelector(
                        ".fantasy-pitch"
                    );

                if (!pitch) {
                    return;
                }

                const playerSlots =
                    pitch.querySelectorAll(
                        ".player-slot[data-player-id]"
                    );

                if (playerSlots.length !== 11) {

                    alert(
                        "يجب اختيار 11 لاعبًا أولًا."
                    );

                    return;
                }

                const originalText =
                    saveTeamImage.innerHTML;

                saveTeamImage.disabled = true;

                saveTeamImage.innerHTML =
                    "⏳ جاري تجهيز الصورة...";

                try {

                    await new Promise(
                        function (resolve) {
                            setTimeout(
                                resolve,
                                500
                            );
                        }
                    );

                    const canvas =
                        await html2canvas(
                            pitch,
                            {
                                backgroundColor:
                                    "#168a16",

                                scale:
                                    2,

                                useCORS:
                                    true,

                                allowTaint:
                                    false,

                                logging:
                                    false
                            }
                        );

                        const ctx =
    canvas.getContext("2d");

const imageData =
    ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

const data =
    imageData.data;

const brightness =
    0.75;

for (
    let i = 0;
    i < data.length;
    i += 4
) {

    data[i] =
        data[i] * brightness;

    data[i + 1] =
        data[i + 1] * brightness;

    data[i + 2] =
        data[i + 2] * brightness;
}

ctx.putImageData(
    imageData,
    0,
    0
);

                    const image =
                        canvas.toDataURL(
                            "image/png"
                        );

                    const link =
                        document.createElement(
                            "a"
                        );

                    link.href =
                        image;

                    link.download =
                        "EUROFOR-Team.png";

                    document.body.appendChild(
                        link
                    );

                    link.click();

                    link.remove();

                } catch (error) {

                    console.error(
                        "Team image error:",
                        error
                    );

                    alert(
                        "حدث خطأ أثناء إنشاء صورة التشكيلة."
                    );

                } finally {

                    saveTeamImage.disabled =
                        false;

                    saveTeamImage.innerHTML =
                        originalText;
                }
            }
        );
    }


    /* =========================================================
       تشغيل التشكيلة أول مرة
       ========================================================= */

    buildFormation();

});
</script>
