{% extends 'base.html' %}
{% block content %}


<body style="background: linear-gradient(-45deg, black, black,black,black,black);">


 
<div class="profile-container">


    <div class="profile-card">


        <div class="profile-avatar">

            👤

        </div>


        <h1>
            {{ user.username }}
        </h1>


        <p>
            EURFOT
        </p>


    </div>


    <div class="profile-stats">


    <div class="profile-box">

        <h3>
            🏆 Ranking
        </h3>

        <span>
            #{{ rank|default:"0" }}
        </span>

    </div>



    <div class="profile-box">

        <h3>
            ⭐ Points
        </h3>

        <span>
            {{ total_points }}
        </span>

    </div>



    <div class="profile-box">

        <h3>
            ⚽ Predictions
        </h3>

        <span>
            {{ total_predictions }}
        </span>

    </div>



    <div class="profile-box correct-box">

        <h3>
            ✅ Correct
        </h3>

        <span>
            {{ correct_predictions }}
        </span>

    </div>


</div>



    





    <div class="profile-actions">


        <a href="#">
            My Predictions
        </a>


        <a href="#">
            My Squad
        </a>


        <a href="#">
            Team Of Week
        </a>


    </div>


</div>


<form action="{% url 'logout' %}" method="POST">

    {% csrf_token %}

    <button class="logout-profile-btn">
        Logout
    </button>

</form>




<style>


.profile-container{

    width:90%;
    max-width:1100px;
    margin:40px auto;

}


.profile-card{

    background:
    linear-gradient(145deg,#111,#050505);

    border-radius:20px;

    padding:35px;

    text-align:center;

    color:white;

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
    0 20px 50px rgba(0,0,0,.7);

}



.profile-avatar{

    width:90px;
    height:90px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:45px;

    background:#111;

    border:3px solid #008cff;

}



.profile-stats{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;

    margin-top:25px;

}





.profile-box{

    background:#080808;

    color:white;

    height:140px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    border-radius:15px;

    text-align:center;

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
    0 15px 30px rgba(0,0,0,.5);

}



.profile-box span{

    font-size:30px;

    font-weight:bold;

}



.profile-actions{

    margin-top:25px;

    display:flex;

    gap:15px;

}


.profile-actions a{

    flex:1;

    text-align:center;

    padding:18px;

    background:rgb(255, 0, 0);

    color:white;

    text-decoration:none;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.15);

}


.logout-profile-btn{

    width:7%;

    margin-top:25px;

    margin-left:890px;

    padding:15px;

    background:black;

    color:white;

    border-radius:12px;

    border:2px solid rgba(255,0,0,.7);

    font-weight:bold;

    cursor:pointer;

}



.correct-box{

    background:
    linear-gradient(145deg,#071a0d,#020805);

    border:1px solid rgba(0,255,100,.35);

    box-shadow:
    0 15px 35px rgba(0,0,0,.6),
    inset 0 0 15px rgba(0,255,100,.08);

}


.correct-box h3{

    color:#5cff8d;

}


.correct-box span{

    color:#ffffff;

    font-size:32px;

    font-weight:800;

}





@media (max-width:1000px) {
    .profile-container{
        zoom: 190%;
    }


    .logout-profile-btn{
        width: 17%;
        margin-left: 42%;
        font-size: 25px;
        height: 4%;
    }
}




</style>

{% endblock %}
