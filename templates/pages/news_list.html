{% extends 'base.html' %}
{% block content %}


<body style="background: linear-gradient(90deg,rgb(0, 255, 255),rgb(98, 0, 255));">



<div style="max-width:800px;margin:40px auto;padding:20px;font-family:Arial;color:white;">

    <h2 style="text-align:center;">الأخبار</h2>

    {% if articles %}

        <div style="display:flex;flex-direction:column;gap:15px;margin-top:20px;">

            {% for article in articles %}

                <a href="{% url 'news_detail' article.id %}" style="display:flex;gap:15px;background:#111;border-radius:12px;padding:15px;text-decoration:none;color:inherit;">

                    {% if article.image %}
                        <img src="{{ article.image.url }}" width="100" style="border-radius:8px;object-fit:cover;">
                    {% endif %}

                    <div>
                        <h3 style="margin:0 0 8px;">{{ article.title }}</h3>
                        <span style="color:#888;font-size:13px;">{{ article.published_at|date:"Y-m-d H:i" }}</span>
                    </div>

                </a>

            {% endfor %}

        </div>

    {% else %}

        <p style="text-align:center;color:#888;">لا توجد أخبار حالياً</p>

    {% endif %}

</div>

{% endblock %}
